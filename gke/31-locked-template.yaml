# Same runtime as 10-template.yaml, but egress is locked down in the TEMPLATE.
# Agent Sandbox turns spec.networkPolicy into a managed NetworkPolicy for these pods.
# Result: DNS works, everything else out of the pod is blocked.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-locked-template
  namespace: agents
spec:
  networkPolicy:
    egress:
    - ports:
      - {protocol: UDP, port: 53}
      - {protocol: TCP, port: 53}
  podTemplate:
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
      tolerations:
      - key: sandbox.gke.io/runtime
        operator: Equal
        value: gvisor
        effect: NoSchedule
      containers:
      - name: runtime
        image: registry.k8s.io/agent-sandbox/python-runtime-sandbox:v0.1.0
        resources:
          requests: {cpu: "250m", memory: 512Mi}
          limits:   {cpu: "500m", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: python-locked-pool
  namespace: agents
spec:
  replicas: 1
  sandboxTemplateRef:
    name: python-locked-template
