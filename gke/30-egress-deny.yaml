# Act 3: default-deny egress for sandbox pods. Only DNS is allowed out.
# Ingress is untouched, so the router can still reach the sandboxes.
# Requires NetworkPolicy enforcement (Dataplane V2, on by default in Autopilot).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress-deny
  namespace: agents
spec:
  podSelector: {}          # every pod in the agents namespace (only sandboxes live here)
  policyTypes: [Egress]
  egress:
  - ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
